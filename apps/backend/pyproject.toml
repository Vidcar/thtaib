[project]
name = "workbench-backend"
version = "0.1.0"
description = "Local AI Workbench backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.7.13,<0.8",
    "fastapi>=0.141.1,<0.142",
    "gguf>=0.19.0,<0.20",
    "httpx>=0.28,<0.29",
    "huggingface-hub>=1.32.0,<1.33",
    "langchain>=1.3.18,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "psutil>=7.2.2,<8",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
workbench-backend = "workbench_backend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "workbench_backend.app:app"

[tool.uv]
package = true
