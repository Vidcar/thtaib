[project]
name = "workbench-backend"
version = "0.1.0"
description = "Local AI Workbench backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.7.19",
    "fastapi>=0.141.1,<0.142",
    "gguf>=0.19.0,<0.20",
    "httpx>=0.28,<0.29",
    "huggingface-hub>=1.32.0,<1.33",
    "jsonschema>=4.26,<5",
    "langchain[mcp]>=1.4.2,<2",
    "langchain-openai>=1.0,<2",
    "langchain-protocol==0.0.19",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "pillow>=12,<13",
    "psutil>=7.2.2,<8",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "uvicorn[standard]>=0.32,<1",
    "beautifulsoup4>=4.14,<5",
    "ddgs>=9.11,<10",
    "aiohttp>=3.13,<4",
    "jinja2>=3.1,<4",
]

[project.scripts]
workbench-backend = "workbench_backend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "workbench_backend.app:app"

[tool.uv]
package = true
