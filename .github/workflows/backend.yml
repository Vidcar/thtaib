# Product-command gate for the registered backend unittest.
# Not a contract-generation, import-boundary, or integration gate.
# A green run is not catalogue verified evidence and not stage acceptance.
# Windows coverage is kept: windows-latest still runs the full suite when
# backend paths change. Unrelated PRs skip the expensive install/test and
# keep the check name so classic branch protection does not deadlock.
name: Backend unittest

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: path-filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect matching paths
        id: filter
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILTER_REGEX: '^(apps/backend/|\.github/workflows/backend\.yml$|\.github/scripts/ci-path-filter\.sh$)'
        run: bash .github/scripts/ci-path-filter.sh

  backend-unittest:
    name: backend-unittest (${{ matrix.os }})
    needs: changes
    runs-on: ${{ needs.changes.outputs.run == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Record path-filter skip
        if: needs.changes.outputs.run != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Skipping full backend unittest; no matching paths. Check name kept for branch protection."
      - name: Check out the reviewed tree
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        if: needs.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: apps/backend
      - name: Install the backend
        if: needs.changes.outputs.run == 'true'
        run: uv sync --frozen
      - name: Test the backend
        if: needs.changes.outputs.run == 'true'
        run: uv run python -m unittest discover -s tests -p "test_*.py"
