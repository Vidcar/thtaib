# Product-command gate for the registered desktop type-check and build.
# Not a contract-generation, import-boundary, or integration gate.
# A green run is not catalogue verified evidence and not stage acceptance.
# One Windows desktop build is kept: windows-latest still runs the full
# type-check and build when desktop paths change. Unrelated PRs skip the
# expensive install/build and keep the check name so classic branch
# protection does not deadlock.
name: Desktop typecheck and build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: path-filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect matching paths
        id: filter
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILTER_REGEX: '^(apps/desktop/|\.github/workflows/desktop\.yml$|\.github/scripts/ci-path-filter\.sh$)'
        run: bash .github/scripts/ci-path-filter.sh

  desktop-typecheck-build:
    name: desktop-typecheck-build (${{ matrix.os }})
    needs: changes
    runs-on: ${{ needs.changes.outputs.run == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Record path-filter skip
        if: needs.changes.outputs.run != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Skipping full desktop type-check and build; no matching paths. Check name kept for branch protection."
      - name: Check out the reviewed tree
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        if: needs.changes.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.3
      - name: Set up Node.js 24
        if: needs.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install the desktop
        if: needs.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Type-check the desktop
        if: needs.changes.outputs.run == 'true'
        run: pnpm run typecheck
      - name: Build the desktop
        if: needs.changes.outputs.run == 'true'
        run: pnpm run build
