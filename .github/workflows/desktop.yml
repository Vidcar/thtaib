# Product-command gate for the registered desktop type-check and build.
# Not a contract-generation, import-boundary, or integration gate.
# A green run is not catalogue verified evidence and not stage acceptance.
name: Desktop typecheck and build

on:
  pull_request:
  push:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  desktop-typecheck-build:
    name: desktop-typecheck-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.3
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install the desktop
        run: pnpm install --frozen-lockfile
      - name: Type-check the desktop
        run: pnpm run typecheck
      - name: Build the desktop
        run: pnpm run build
