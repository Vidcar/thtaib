# Required contexts remain stable; select changed paths once for all tiers.
name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      desktop: ${{ steps.paths.outputs.desktop }}
      contracts: ${{ steps.paths.outputs.contracts }}
      model: ${{ steps.paths.outputs.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        run: python .github/scripts/ci_paths.py

  backend-unittest:
    name: backend-unittest (${{ matrix.os }})
    needs: changes
    runs-on: ${{ needs.changes.outputs.backend == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Record path-filter skip
        if: needs.changes.outputs.backend != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Skipping full backend unittest; no matching paths. Check name kept for branch protection."
      - name: Check out the reviewed tree
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: apps/backend
      - name: Install the backend
        if: needs.changes.outputs.backend == 'true'
        run: uv sync --frozen
      - name: Test backend behaviour
        if: needs.changes.outputs.backend == 'true'
        run: uv run python -m tests.run --durations 10
      - name: Test process and runtime integration
        if: needs.changes.outputs.backend == 'true'
        run: uv run python -m tests.run --tier integration --durations 10

  desktop-typecheck-build:
    name: desktop-typecheck-build (${{ matrix.os }})
    needs: changes
    runs-on: ${{ needs.changes.outputs.desktop == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Record path-filter skip
        if: needs.changes.outputs.desktop != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Skipping full desktop type-check and build; no matching paths. Check name kept for branch protection."
      - name: Check out the reviewed tree
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        if: needs.changes.outputs.desktop == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.3
      - name: Set up Node.js 24
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install the desktop
        if: needs.changes.outputs.desktop == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the desktop
        if: needs.changes.outputs.desktop == 'true'
        run: pnpm run build

  shared-contract-freshness:
    name: shared-contract-freshness (ubuntu-latest)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record path-filter skip
        if: needs.changes.outputs.contracts != 'true'
        run: echo "Skipping full contract freshness; no matching paths. Check name kept for branch protection."
      - name: Check out the reviewed tree
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        if: needs.changes.outputs.contracts == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: apps/backend
      - name: Enable pnpm
        if: needs.changes.outputs.contracts == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.3
      - name: Set up Node.js 24
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install the backend
        if: needs.changes.outputs.contracts == 'true'
        working-directory: apps/backend
        run: uv sync --frozen
      - name: Install the desktop
        if: needs.changes.outputs.contracts == 'true'
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Check shared-contract freshness
        if: needs.changes.outputs.contracts == 'true'
        working-directory: apps/backend
        run: uv run python ../../scripts/generate_shared_contracts.py --check

  spec-integrity:
    name: spec-integrity (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python for specification tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check specification structure and pointers
        env:
          SPEC_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_specs.py
      - name: Test the specification checker
        run: python -m unittest discover -s tests/specs -p "test_*.py"

  real-model-smoke:
    needs: changes
    if: needs.changes.outputs.model == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    name: real-model-smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: apps/backend
      - name: Install the backend
        run: uv sync --frozen
      - name: Derive the asset cache key from the product pins
        id: pins
        run: echo "key=$(uv run python -m tests_integration.assets --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned llama-server and tiny GGUF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/real-model-smoke
          key: ${{ steps.pins.outputs.key }}
      - name: Fetch pinned llama-server and tiny GGUF (no-op when cached)
        run: uv run python -m tests_integration.assets
      - name: Run the real-model smoke tier
        env:
          WORKBENCH_REAL_MODEL_SMOKE: required
        run: uv run python -m unittest discover -s tests_integration -t . -p "test_*.py" -v
      - name: Record the llama-server build actually used
        if: always()
        run: |
          uv run python -m tests_integration.assets --show
          server="$(uv run python -m tests_integration.assets --show | sed -n 's/^llama-server: //p')"
          "$server" --version
