# Real-model smoke tier: the backend against a real llama-server (the pinned
# llama.cpp release, Linux x64 CPU build) and a real tiny GGUF.
# Proves plumbing (attach/health, tool-call round trip, thread continuity,
# applied settings), not model capability. Not David-PC capability UAT and
# not catalogue verified evidence. Weights are cached, never committed.
# Not a required merge gate. Path-filtered so unrelated PRs skip it.
name: Real-model smoke

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/real-model-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/real-model-smoke.yml"
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  real-model-smoke:
    name: real-model-smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: apps/backend
      - name: Install the backend
        run: uv sync --frozen
      - name: Derive the asset cache key from the product pins
        id: pins
        run: echo "key=$(uv run python -m tests_integration.assets --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned llama-server and tiny GGUF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/real-model-smoke
          key: ${{ steps.pins.outputs.key }}
      - name: Fetch pinned llama-server and tiny GGUF (no-op when cached)
        run: uv run python -m tests_integration.assets
      - name: Run the real-model smoke tier
        env:
          WORKBENCH_REAL_MODEL_SMOKE: required
        run: uv run python -m unittest discover -s tests_integration -t . -p "test_*.py" -v
      - name: Record the llama-server build actually used
        if: always()
        run: |
          uv run python -m tests_integration.assets --show
          server="$(uv run python -m tests_integration.assets --show | sed -n 's/^llama-server: //p')"
          "$server" --version
