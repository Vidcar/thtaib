name: Specification integrity

on:
  pull_request:
  push:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  spec-integrity:
    name: spec-integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python for specification tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check specification structure and pointers
        env:
          SPEC_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_specs.py
      - name: Test the specification checker
        run: python -m unittest discover -s tests/specs -p "test_*.py"
