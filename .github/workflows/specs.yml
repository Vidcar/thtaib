# Specification pack integrity. Linux-only: the checker is OS-independent.
# spec-integrity (windows-latest) is a retired-name shim so classic branch
# protection does not deadlock until that required check is removed.
# A green run is not catalogue verified evidence.
name: Specification integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spec-integrity:
    name: spec-integrity (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python for specification tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check specification structure and pointers
        env:
          SPEC_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_specs.py
      - name: Test the specification checker
        run: python -m unittest discover -s tests/specs -p "test_*.py"

  spec-integrity-windows-retired:
    name: spec-integrity (windows-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retired OS-duplicate
        run: |
          echo "spec-integrity is Linux-only. This check name is a branch-protection shim."
          echo "Maintainer: remove spec-integrity (windows-latest) from required checks on main."
