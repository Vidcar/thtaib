# Advisory generated-contract freshness gate (CTT-001).
# Not a required branch-protection check. Not catalogue verified evidence.
name: Shared-contract freshness

on:
  pull_request:
  push:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  shared-contract-freshness:
    name: shared-contract-freshness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: apps/backend
      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.3
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install the backend
        working-directory: apps/backend
        run: uv sync --frozen
      - name: Install the desktop
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Check shared-contract freshness
        working-directory: apps/backend
        run: uv run python ../../scripts/generate_shared_contracts.py --check
