# Generated-contract freshness gate (CTT-001). Linux-only: generation is
# OS-independent. Required as shared-contract-freshness (ubuntu-latest).
# Not catalogue verified evidence. Not Issue #36 advisory-only.
name: Shared-contract freshness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: path-filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect matching paths
        id: filter
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILTER_REGEX: '^(apps/backend/src/workbench_backend/contracts/|apps/backend/src/workbench_backend/inference/schemas\.py$|apps/backend/contracts/|apps/backend/tests/contracts/|apps/desktop/src/generated/shared-contracts/|apps/desktop/package\.json$|apps/desktop/pnpm-lock\.yaml$|apps/backend/pyproject\.toml$|apps/backend/uv\.lock$|scripts/generate_shared_contracts\.py$|\.github/workflows/contracts\.yml$|\.github/scripts/ci-path-filter\.sh$)'
        run: bash .github/scripts/ci-path-filter.sh

  shared-contract-freshness:
    name: shared-contract-freshness (ubuntu-latest)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record path-filter skip
        if: needs.changes.outputs.run != 'true'
        run: echo "Skipping full contract freshness; no matching paths. Check name kept for branch protection."
      - name: Check out the reviewed tree
        if: needs.changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.12
        if: needs.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: apps/backend
      - name: Enable pnpm
        if: needs.changes.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.3
      - name: Set up Node.js 24
        if: needs.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install the backend
        if: needs.changes.outputs.run == 'true'
        working-directory: apps/backend
        run: uv sync --frozen
      - name: Install the desktop
        if: needs.changes.outputs.run == 'true'
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Check shared-contract freshness
        if: needs.changes.outputs.run == 'true'
        working-directory: apps/backend
        run: uv run python ../../scripts/generate_shared_contracts.py --check
